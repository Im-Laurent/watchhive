name = "timegrapher-diagnosis"
main = "src/index.ts"
compatibility_date = "2026-08-25"

[vars]
# 콤마로 구분된 허용 Origin 목록. 배포 도메인이 바뀌면 여기만 수정.
ALLOWED_ORIGINS = "https://watch-hive.com,http://localhost:3000,http://localhost:3001"
# 원래 계획은 Gemma 3였으나 Gemini API에서 지원 종료됨(2026-08 확인). 후속인 Gemma 4는
# 추론(thinking) 과정을 끌 수 없어 같은 프롬프트로 21~26초가 걸렸다(실측). 이 기능은 짧은
# 코멘트 한 문단이면 충분해 추론이 불필요하므로, 사고를 끌 수 있어 1.8초에 응답하는 쪽을 택했다.
MODEL_NAME = "gemini-3.5-flash"

# 실제 비밀값(TURNSTILE_SECRET_KEY, GEMINI_API_KEY)은 여기 커밋하지 않고
# `wrangler secret put <이름>`으로 등록한다.
